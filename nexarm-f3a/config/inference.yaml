# NexArm FLUX-3-Action inference config (used by cloud/client.py and 7-/8-inference-*.cmd).
# Port can be overridden from _env.cmd via --port.
robot:
  type: nexarm_follower
  id: follower
  calibration_dir: calibration/follower
  port: COM10
  baudrate: 1000000
  use_degrees: true
  disable_torque_on_disconnect: false
  readback_after_write: true
  cameras:
    scene:
      type: opencv
      index_or_path: 0
      width: 640
      height: 480
      fps: 30
    wrist:
      type: opencv
      index_or_path: 2
      width: 640
      height: 480
      fps: 30
